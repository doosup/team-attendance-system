# 개발 때 Vite proxy가 하던 일을 nginx가 한다: 화면 제공 + /api → 백엔드 (같은 출처라 CORS 불필요)
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://backend:3000/;   # 끝의 /가 /api 접두어를 떼어 낸다
    proxy_set_header Host $host;
    # 접속 IP를 덮어쓴다(이어 붙이지 않음): 브라우저가 보낸 X-Forwarded-For 위조를 버리고 nginx가 본 IP만 넘김
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Vue Router history 모드: 없는 경로는 index.html로
  location / {
    try_files $uri $uri/ /index.html;
  }
}
